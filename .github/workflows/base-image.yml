name: Publish Base Image

# Rebuilds the runtime base image (smartctl + ssacli) used by ko.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - .github/workflows/base-image.yml
  schedule:
    # Weekly rebuild to pick up Debian security updates
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cloudopskit/smartctl_ssacli_exporter/base:latest
