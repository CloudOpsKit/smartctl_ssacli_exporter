name: Publish Docker Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  push-to-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Sets KO_DOCKER_REPO=ghcr.io/<owner>/<repo> and logs in to ghcr.io with GITHUB_TOKEN
      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # ratchet:ko-build/setup-ko@v0.10

      # ssacli is amd64-only, so the image is built for linux/amd64 only (see .ko.yaml)
      - name: Build and push
        run: |
          ko build . \
            --bare \
            --tags="${GITHUB_REF_NAME#v},latest"
